name: Release

# Push a tag like "v1.2.3" to publish a GitHub Release. cliamp-radio instances
# poll the GitHub Releases API and surface an in-app "Install update" prompt
# whenever a new tag is published here.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
